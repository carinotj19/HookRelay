name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[test]'
      - run: python -m compileall -q hookrelay tests migrations
      - name: Validate published OpenAPI 3 specification
        run: python -m openapi_spec_validator hookrelay/static/openapi.json
      - run: pytest --cov=hookrelay --cov-report=term-missing
      - name: Docker-free HTTP reliability demo
        run: python -m hookrelay.reliability_demo

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e ".[test]"
      - name: Windows unit and reliability tests without Docker
        run: python -m pytest --cov=hookrelay --basetemp=.\.pytest-tmp -q
      - name: Windows local HTTP reliability demo
        run: python -m hookrelay.reliability_demo

  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: hookrelay
          POSTGRES_PASSWORD: integration
          POSTGRES_DB: hookrelay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hookrelay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ADMIN_API_KEY: postgres-integration-key
      DATABASE_URL: postgresql+psycopg://hookrelay:integration@localhost:5432/hookrelay
      HOOKRELAY_TEST_POSTGRES_URL: postgresql+psycopg://hookrelay:integration@localhost:5432/hookrelay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[test]'
      - run: alembic upgrade head
      - run: pytest tests/test_postgres_integration.py -q
