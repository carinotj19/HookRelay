x-app: &app
  build: .
  env_file: .env
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: hookrelay
      POSTGRES_USER: hookrelay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hookrelay"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    <<: *app
    ports: ["127.0.0.1:8000:8000"]

  worker:
    <<: *app
    command: ["celery", "-A", "hookrelay.celery_app:celery", "worker", "--loglevel=INFO", "--concurrency=2"]

  beat:
    <<: *app
    command: ["celery", "-A", "hookrelay.celery_app:celery", "beat", "--loglevel=INFO"]

volumes:
  pgdata:
  redisdata:
