<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HookRelay | API reference</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui.css">
  <style>
    body { margin: 0; background: #f6f8fb; }
    .topbar { background: #101827; color: #fff; padding: 15px 24px; font: 600 16px system-ui, sans-serif; }
    .topbar a { color: #b9d7ff; float: right; font-size: 13px; }
    noscript { font: 14px system-ui, sans-serif; display: block; padding: 20px; }
  </style>
</head>
<body>
  <header class="topbar">HookRelay API reference <a href="/openapi.json">OpenAPI JSON</a></header>
  <div id="swagger-ui"></div>
  <noscript>JavaScript is required for interactive Swagger UI. The OpenAPI JSON specification is available at /openapi.json.</noscript>
  <script src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5/swagger-ui-bundle.js"></script>
  <script>
    window.addEventListener("load", function () {
      if (!window.SwaggerUIBundle) {
        document.getElementById("swagger-ui").textContent =
          "Swagger UI could not load from the CDN. Check your internet connection; /openapi.json is still available.";
        return;
      }
      window.SwaggerUIBundle({
        url: "/openapi.json",
        dom_id: "#swagger-ui",
        deepLinking: true,
        displayRequestDuration: true,
        persistAuthorization: false,
        validatorUrl: null,
        presets: [window.SwaggerUIBundle.presets.apis],
        layout: "BaseLayout"
      });
    });
  </script>
</body>
</html>
